* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body { background: #081932; color: #fff; font-family: Arial, sans-serif; }
.screen {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  padding: 16vh 8vw;
  text-align: center;
  background: radial-gradient(ellipse at 80% 85%, #154ca0, #081932 74%);
}
.screen.green { background: radial-gradient(ellipse at 80% 85%, #125540, #081932 74%); }
.frame { position: absolute; top: 4vh; right: 3vw; bottom: 4vh; left: 3vw; border: 1px solid #64829f; pointer-events: none; }
.brand {
  position: absolute;
  top: 6vh;
  left: 5vw;
  right: 5vw;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.8vmin;
  font-weight: bold;
  letter-spacing: .16em;
}
.eagle { display: block; width: auto; height: 10vh; margin-right: .8em; }
.screen.hero { background: #1451ae; }
.hero .brand { display: none; }
.hero .frame { border-color: #ffffff66; }
.hero .dot { background: #ffffff66; }
.hero .dot.current { background: white; }
.hero-content { display: flex; align-items: center; justify-content: center; }
.hero-content img { width: 30vw; max-width: 54vh; height: auto; margin-right: 5vw; }
.hero-content h1 { color: #65cf3e; font-family: "SCS Display", Impact, sans-serif; font-size: 26vmin; font-weight: 700; letter-spacing: -.04em; white-space: nowrap; transform: skewX(-9deg) scaleX(.86); }
h1 { margin: 0; font-size: 15vmin; font-weight: 900; line-height: .93; letter-spacing: -.045em; }
h1 span { display: block; }
h1 span + span { margin-top: .08em; color: #7be492; }
[hidden] { display: none !important; }
.record h1 { font-size: 5.5vmin; letter-spacing: .06em; }
.record-score { margin: 1vh 0 0; font-size: 27vmin; font-weight: 900; line-height: .95; color: #7be492; }
.record-holder { margin: 1vh 0 0; font-size: 8vmin; font-weight: 900; }
.record-date { margin: 1vh 0 0; font-size: 3.8vmin; }
.record-previous { margin: 4vh 0 0; font-size: 3.4vmin; color: #d3e4ec; }
.progress { position: absolute; bottom: 8vh; left: 0; right: 0; }
.dot { display: inline-block; width: 4vw; height: .55vh; margin: 0 .3vw; background: #64829f; }
.dot.current { background: #7be492; }
</style>

  var slides = [

  var hero = document.getElementById("hero");
  var record = document.getElementById("record");
  var dots = document.querySelectorAll(".dot");
  var index = 0;

  function showNext() {
    index = (index + 1) % slides.length;
    var slide = slides[index];
    screen.className = slide.hero ? "screen hero" : slide.green ? "screen green" : "screen";

    hero.hidden = !slide.hero;
    message.hidden = !!(slide.record || slide.hero);

    (slide.lines || []).forEach(function (line) {
      var span = document.createElement("span");
      span.textContent = line;
      message.appendChild(span);
    });
    for (var i = 0; i < dots.length; i += 1) {
      dots[i].className = i === index ? "dot current" : "dot";
    }
  }

  window.setInterval(showNext, 8000);
